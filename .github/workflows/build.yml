name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:|AssertionError" -A4 build.log | head -120 > err.txt || true
          [ -s err.txt ] || tail -60 build.log > err.txt
          msg=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' err.txt)
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SprintFinish-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SprintFinish-apk
          path: SprintFinish-*.apk

      - name: Publish as a release (download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sprint Finish build ${{ github.run_number }}
          prerelease: true
          files: SprintFinish-${{ github.run_number }}.apk
